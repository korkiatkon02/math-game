<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Calculation Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Math Game</h1>
            <div class="difficulty-selection">
                <button class="diff-btn" data-diff="plus_minus">Plus & Minus</button>
                <button class="diff-btn" data-diff="multiply_beginner">Multiply Beginner</button>
                <button class="diff-btn" data-diff="multiply_advanced">Multiply Advanced</button>
            </div>
            <div class="menu-actions">
                <button id="btn-study" class="secondary-btn">Multiplication Table</button>
                <button id="btn-settings" class="secondary-btn">Settings</button>
            </div>
        </div>

        <!-- Study Screen -->
        <div id="study-screen" class="screen">
            <div class="study-header">
                <h2>Multiplication Table</h2>
                <p class="study-subtitle">1–20 × 1–12 (Tap or hover cell to inspect)</p>
            </div>
            <div id="study-inspect-badge" class="study-inspect-badge">1 × 1 = 1</div>
            <div class="table-wrapper">
                <table id="multiplication-table"></table>
            </div>
            <button id="btn-back-study" class="secondary-btn">Back to Menu</button>
        </div>

        <!-- Settings Screen -->
        <div id="settings-screen" class="screen">
            <h2>Settings</h2>
            <div class="settings-container">
                <label for="delay-input">Transition Delay (ms):</label>
                <input type="number" id="delay-input" value="400" min="0" max="2000" step="100">
                <button id="btn-save-settings">Save & Back</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="header">
                <div class="stat">Score: <span id="score">0</span></div>
                <div class="stat">Streak: <span id="streak">0</span></div>
                <button id="btn-stop" class="stop-btn">Stop Game</button>
            </div>
            <div class="question-container">
                <span id="question"></span>
            </div>
            <div class="choices-container">
                <button class="choice-btn" id="choice-0"></button>
                <button class="choice-btn" id="choice-1"></button>
                <button class="choice-btn" id="choice-2"></button>
                <button class="choice-btn" id="choice-3"></button>
            </div>
        </div>

        <!-- Analysis Screen -->
        <div id="analysis-screen" class="screen">
            <h2>Analysis Board</h2>
            <div class="analysis-results-card">
                <div class="analysis-stat-item">
                    <div class="analysis-stat-label">Final Score</div>
                    <div class="analysis-stat-val" id="final-score">0</div>
                </div>
                <div class="analysis-stat-item">
                    <div class="analysis-stat-label">Highest Streak</div>
                    <div class="analysis-stat-val" id="highest-streak">0</div>
                </div>
            </div>
            <h3 class="analysis-section-title">Most Wrong Answers</h3>
            <div class="analysis-list" id="analysis-list">
                <!-- Javascript will populate this -->
            </div>
            <div class="menu-actions">
                <button id="btn-restart">Play Again</button>
                <button id="btn-study-analysis" class="secondary-btn">Study Table</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
